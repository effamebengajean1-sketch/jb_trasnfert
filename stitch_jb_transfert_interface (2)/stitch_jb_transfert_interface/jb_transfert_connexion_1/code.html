                    "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}]

          },

<style>
        body {
            background-color: #EAF3FC;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .auth-card-shadow {
            box-shadow: 0px 4px 20px rgba(15, 27, 45, 0.08);
        }
        .input-glow:focus {
            outline: none;
            border-color: #0B4F9E;
            box-shadow: 0 0 0 2px rgba(11, 79, 158, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md text-on-background">
<!-- TopAppBar for Identity -->
<header class="bg-surface-container-lowest shadow-sm h-20 fixed top-0 w-full z-50">
<div class="flex justify-between items-center w-full px-gutter max-w-container-max mx-auto h-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-headline-md" style="font-variation-settings: 'FILL' 1;">cloud_upload</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary">JB Transfert</h1>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-20 pb-12">
<!-- Auth Container -->
<div class="w-full max-w-[440px] bg-white rounded-xl auth-card-shadow p-lg md:p-xl transition-all duration-300" id="auth-container">
<!-- Login View -->
<div id="login-view">
<div class="mb-xl text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Bon retour</h2>
<p class="font-body-md text-on-surface-variant">Accédez à vos fichiers sécurisés</p>
</div>
<form class="space-y-lg" onsubmit="event.preventDefault();">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="login-email">E-mail professionnel</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl input-glow transition-all font-body-md text-on-surface" id="login-email" placeholder="nom@entreprise.fr" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block" for="login-password">Mot de passe</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Oublié ?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl input-glow transition-all font-body-md text-on-surface" id="login-password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-[#0B4F9E] hover:bg-[#2D7DD2] text-white font-body-md font-semibold py-3.5 rounded-xl transition-all active:scale-95 shadow-sm">
                            Se connecter
                        </button>
</div>
</form>
<div class="mt-xl pt-lg border-t border-outline-variant text-center">
<button class="font-body-sm text-on-surface-variant hover:text-primary transition-colors" onclick="toggleAuth('register')">
                        Pas encore de compte ? <span class="font-semibold text-primary">Créer un compte</span>
</button>
</div>
</div>
<!-- Registration View (Hidden by default) -->
<div class="hidden" id="register-view">
<div class="mb-xl text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Créer un compte</h2>
<p class="font-body-md text-on-surface-variant">Rejoignez JB Transfert dès aujourd'hui</p>
</div>
<form class="space-y-lg" onsubmit="event.preventDefault();">
<div class="grid grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="reg-first">Prénom</label>
<input class="w-full px-4 py-3 bg-white border border-outline-variant rounded-xl input-glow transition-all font-body-md text-on-surface" id="reg-first" placeholder="Jean" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="reg-last">Nom</label>
<input class="w-full px-4 py-3 bg-white border border-outline-variant rounded-xl input-glow transition-all font-body-md text-on-surface" id="reg-last" placeholder="Dupont" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="reg-email">E-mail professionnel</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl input-glow transition-all font-body-md text-on-surface" id="reg-email" placeholder="nom@entreprise.fr" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="reg-password">Définir un mot de passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl input-glow transition-all font-body-md text-on-surface" id="reg-password" placeholder="Min. 8 caractères" type="password"/>
</div>
</div>
<div class="flex items-start gap-3 py-sm">
<input class="mt-1 w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="terms" type="checkbox"/>
<label class="font-body-sm text-on-surface-variant leading-tight" for="terms">
                            J'accepte les <a class="text-primary underline" href="#">Conditions d'utilisation</a> et la <a class="text-primary underline" href="#">Politique de confidentialité</a>.
                        </label>
</div>
<div class="pt-sm">
<button class="w-full bg-[#0B4F9E] hover:bg-[#2D7DD2] text-white font-body-md font-semibold py-3.5 rounded-xl transition-all active:scale-95 shadow-sm">
                            Créer mon compte
                        </button>
</div>
</form>
<div class="mt-xl pt-lg border-t border-outline-variant text-center">
<button class="font-body-sm text-on-surface-variant hover:text-primary transition-colors" onclick="toggleAuth('login')">
                        Vous avez déjà un compte ? <span class="font-semibold text-primary">Se connecter</span>
</button>
</div>
</div>
</div>
</main>
<!-- Footer as predicted -->
<footer class="bg-surface-container border-t border-outline-variant w-full py-xl px-gutter">
<div class="flex flex-col md:flex-row justify-between items-center max-w-container-max mx-auto gap-md">
<div class="flex items-center gap-2 mb-md md:mb-0">
<span class="material-symbols-outlined text-primary text-headline-sm">cloud_upload</span>
<span class="font-headline-sm text-headline-sm text-primary">JB Transfert</span>
</div>
<div class="flex gap-lg font-label-sm text-label-sm text-on-surface-variant">
<a class="hover:text-primary underline transition-all" href="#">Conditions d'utilisation</a>
<a class="hover:text-primary underline transition-all" href="#">Confidentialité</a>
<a class="hover:text-primary underline transition-all" href="#">Aide</a>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant md:order-first">
                © 2024 JB Transfert. Tous droits réservés.
            </p>
</div>
</footer>
<script>
        function toggleAuth(view) {
            const loginView = document.getElementById('login-view');
            const registerView = document.getElementById('register-view');
            const container = document.getElementById('auth-container');

            // Visual feedback for transition
            container.style.opacity = '0';
            container.style.transform = 'translateY(10px)';

            setTimeout(() => {
                if (view === 'register') {
                    loginView.classList.add('hidden');
                    registerView.classList.remove('hidden');
                } else {
                    registerView.classList.add('hidden');
                    loginView.classList.remove('hidden');
                }
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 200);
        }

        // Simple form interaction
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.remove('text-primary');
            });
        });
    </script>
</body></html>
