<!-- Micro-interaction script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if(this.textContent.includes('Copier')) {
                    const originalText = this.innerHTML;
                    this.innerHTML = '<span class="material-symbols-outlined text-[18px]" data-icon="check">check</span> Copié !';
                    this.classList.add('text-green-600', 'border-green-600');
                    setTimeout(() => {
                        this.innerHTML = originalText;
                        this.classList.remove('text-green-600', 'border-green-600');
                    }, 2000);
                }
            });
        });

        // Simple Close Logic for demo
        document.querySelector('[data-icon="close"]').parentElement.addEventListener('click', () => {
            document.querySelector('.fixed.inset-0.z-50').style.display = 'none';
